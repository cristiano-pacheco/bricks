app:
  http:
    cors:
      allowedorigins: ["https://app.example.com"]
      allowedmethods: ["GET", "POST", "OPTIONS"]
      allowedheaders: ["Accept", "Authorization", "Content-Type"]
      exposedheaders: ["X-Example"]
      allowcredentials: true
      maxage: 300
      optionspassthrough: false
      debug: false
